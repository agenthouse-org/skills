<div id="viewport">
  <div id="stage" data-duration="15" data-w="1920" data-h="1080">
    <div class="fallback-word" aria-hidden="true"><span class="fallback-crm">CRM</span><span class="fallback-deal">DealDesk</span></div>
    <canvas class="motion-three" data-motion-three aria-hidden="true"></canvas>
    <section class="beat opening" data-in="0" data-out="5" data-enter="0.6"><div class="sheet"><span class="sr-only">CRM</span></div></section>
    <section class="beat transition" data-in="5" data-out="10" data-enter="0.2"><div class="sheet"></div></section>
    <section class="beat end" data-in="10" data-out="15" data-enter="0.5" data-hold="1"><div class="sheet"><span class="sr-only">DealDesk</span><a class="end-link" href="{{end.href}}">{{end.url}} <span aria-hidden="true">↗</span></a></div></section>
  </div>
</div>
<p class="sr-only">{{sr}}</p>
